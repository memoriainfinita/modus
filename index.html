<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modus</title>
  <link rel="stylesheet" href="dist/app.css">
</head>
<body>
  <div id="browser-warning">
    This browser has no Web MIDI, so a controller cannot connect (Chrome, Edge and Firefox have it). Everything else — song builder, circle of fifths, history — still works.
    <button onclick="this.parentElement.style.display='none'" style="margin-left:12px;background:transparent;border:1px solid #fff;color:#fff;border-radius:3px;padding:2px 8px;cursor:pointer">×</button>
  </div>
  <div id="cdn-error-banner">Failed to load a required resource. Check your internet connection.</div>
  <div id="app">
<div id="zone1"></div>
    <div id="zone2"></div>
    <div id="zone3"></div>
  </div>

  <!-- Resource load errors do not reach window.onerror — capture phase listener required -->
  <script>
    window.addEventListener('error', function (e) {
      var el = e.target
      if (el && el.tagName === 'SCRIPT' && el.src && el.src.indexOf('jsdelivr') !== -1) {
        document.getElementById('cdn-error-banner').classList.add('visible')
      }
    }, true)
  </script>

  <!-- CDN dependencies — UMT and notae pinned to a commit; bump deliberately -->
  <script src="https://cdn.jsdelivr.net/gh/memoriainfinita/UMT@debda148eaa927287ee3ea8106943b91c50d7695/dist/umt.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/memoriainfinita/notae@8fb052dbcc936fb8aed443cb79bbefcf9e9ff871/dist/notae.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.7.1/dist/abcjs-basic-min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>

  <script src="dist/app.js"></script>
</body>
</html>
